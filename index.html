<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神專口試模擬考場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 考場 = 一張病歷夾。左側病人與紀錄，右側問診/檢查按鈕；頂部一條考場計時帶。 */
:root{
 --bg:#EEF1EE; --surface:#FBFCFA; --sunk:#E3E8E4; --ink:#17201C; --muted:#5A6862; --line:#CDD6D1;
 --accent:#A52A22; --accent-soft:#F4DEDB; --ok:#2C6A4D; --ok-soft:#DCEDE3; --warn:#9A6514; --warn-soft:#F6E8CF;
 --chip:#E5EBE7; --chip-on:#2C3A34; --chip-on-ink:#F2F5F3;
 --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
 --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
 --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#111613; --surface:#181F1B; --sunk:#202923; --ink:#E6ECE8; --muted:#97A69F; --line:#2D3832;
 --accent:#E2685D; --accent-soft:#3A2220; --ok:#6CC395; --ok-soft:#1D3328; --warn:#E3B25A; --warn-soft:#3A2F1A;
 --chip:#232D27; --chip-on:#DCE6E0; --chip-on-ink:#141A17; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#111613; --surface:#181F1B; --sunk:#202923; --ink:#E6ECE8; --muted:#97A69F; --line:#2D3832;
 --accent:#E2685D; --accent-soft:#3A2220; --ok:#6CC395; --ok-soft:#1D3328; --warn:#E3B25A; --warn-soft:#3A2F1A;
 --chip:#232D27; --chip-on:#DCE6E0; --chip-on-ink:#141A17; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0}
h2{font-size:1.45rem} h3{font-size:1.05rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.85rem} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.2rem;font-weight:800}
.brand .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);border:1px solid var(--accent);padding:1px 6px;border-radius:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.tabs button{background:none;border:0;padding:6px 12px;border-radius:var(--r);color:var(--muted);white-space:nowrap;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--sunk)}

main{padding-block:24px 64px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:var(--r);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:16px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800;letter-spacing:.01em}
.hero p.lead{font-size:1.02rem;color:var(--muted);max-width:60ch}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:20px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.flow div{padding:12px 14px;border-right:1px solid var(--line)} .flow div:last-child{border-right:0}
.flow b{display:block;font-family:var(--f-mono);font-size:1.25rem;color:var(--accent)}
.setup .opt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.caseline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.caseline:first-child{border-top:0}
.badge{font-size:.72rem;padding:1px 7px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.badge.real{color:var(--accent);border-color:var(--accent)}
.badge.ai{color:var(--warn);border-color:var(--warn)}
.radio{display:flex;gap:8px;align-items:center}
.toggle{display:flex;gap:8px;align-items:center;font-size:.9rem}

/* exam bar */
.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:15;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.exbar .clock{font-family:var(--f-mono);font-size:2rem;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.exbar .clock.warn{color:var(--warn)} .exbar .clock.over{color:var(--accent)}
.exbar .ph{display:grid}
.exbar .ph span{font-size:.75rem;opacity:.75;letter-spacing:.06em}
.exbar .ph b{font-size:1rem}
.exbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.exbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.exbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bell{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:8px 14px;margin-bottom:12px;font-weight:700}
.bell.red{background:var(--accent-soft);border-color:var(--accent)}

.exgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.pt{display:grid;gap:6px}
.pt .who{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.pt .door{font-size:.92rem;color:var(--muted)}
.pt .cc{font-size:1.05rem;border-left:3px solid var(--accent);padding-left:10px}
.log{max-height:56vh;overflow:auto;display:grid;gap:10px;padding-right:4px}
.log .e{display:grid;gap:2px;font-size:.92rem}
.log .q{color:var(--muted);font-size:.82rem}
.log .q b{color:var(--ink);font-weight:500}
.log .a{background:var(--sunk);border-radius:var(--r);padding:6px 10px}
.log .e.ne .a{background:var(--ok-soft)}
.log .e.ai .a{background:var(--warn-soft)}
.empty{color:var(--muted);font-size:.9rem;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.groups{display:grid;gap:12px}
.grp h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);padding:4px 10px;border-radius:999px;font-size:.84rem;line-height:1.4}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip.miss{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input{flex:1}
.ai-note{font-size:.82rem;color:var(--muted);margin-top:6px}

/* present & examiner */
.pres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pres .full{grid-column:1/-1}
.qcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:grid;gap:10px}
.qcard .qn{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
.qcard .qt{font-size:1.08rem;font-weight:700}
.ansbox{background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:.93rem}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.84rem}
.rate button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chat{display:grid;gap:10px;max-height:52vh;overflow:auto}
.chat .m{padding:8px 12px;border-radius:var(--r);white-space:pre-wrap;font-size:.94rem}
.chat .m.ex{background:var(--sunk)} .chat .m.me{background:var(--ok-soft);justify-self:end;max-width:85%}

/* debrief */
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.score .v{font-family:var(--f-mono);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.score .l{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.miss-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.miss-list li{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.miss-list li:first-child{border-top:0}
.miss-list .k{font-weight:700}
.miss-list .k.no{color:var(--accent)} .miss-list .k.yes{color:var(--ok)}
.ref dl{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr);gap:8px 14px;margin:0}
.ref dt{font-weight:700;color:var(--muted);font-size:.88rem}
.ref dd{margin:0}
.ref ol,.ref ul{margin:0;padding-left:1.2em}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

/* templates */
.tpl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.tpl .side{display:grid;gap:2px;position:sticky;top:80px}
.tpl .side button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r);color:var(--muted)}
.tpl .side button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;max-width:860px}
.doc h3{margin:18px 0 8px;font-size:1.1rem} .doc h3:first-child{margin-top:0}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{padding-left:1.3em} .doc li{margin:3px 0}
.doc table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{color:var(--muted);font-weight:700}
.doc ol.steps li{margin:6px 0}

/* bank */
.bankbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bankbar select{width:auto}
.flash{max-width:820px}
.pill{font-size:.75rem;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted)}

/* records */
table.rec{border-collapse:collapse;width:100%;font-size:.9rem}
table.rec th,table.rec td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

@media (max-width:900px){
 .hero,.exgrid,.two,.tpl{grid-template-columns:minmax(0,1fr)}
 .tpl .side{position:static;display:flex;overflow-x:auto}
 .tpl .side button{white-space:nowrap}
 .scores{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pres{grid-template-columns:minmax(0,1fr)}
 .exbar{top:calc(env(safe-area-inset-top,0px) + 92px)}
}
@media (max-width:520px){
 .flow{grid-template-columns:minmax(0,1fr)} .flow div{border-right:0;border-bottom:1px solid var(--line)}
 .setup .opt{grid-template-columns:minmax(0,1fr)}
 .exbar .clock{font-size:1.6rem}
 .miss-list li{grid-template-columns:minmax(0,1fr)}
 .ref dl{grid-template-columns:minmax(0,1fr)}
 .doc{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <div class="brand"><h1>神專口試模擬考場</h1><span class="tag">ORAL · NEURO</span></div>
 <nav class="tabs" id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* ===== 問診與 NE 項目（所有案例共用，不提示重點） ===== */
const HX_GROUPS = [
 ["基本資料", [["job","教育程度/職業"],["hand","慣用手"],["diet","飲食（茹素？）"]]],
 ["主訴與病程", [["onset","何時開始？怎麼開始？"],["course","進展方式（漸進/階梯/波動）"],["dist","部位與分布（左右/近遠端）"],["func","功能影響/輔具"],["trigger","誘發/緩解因子、日夜變化"],["tx","治療與藥物反應"]]],
 ["Motor", [["prox","近端：梳頭、爬樓梯、蹲站"],["distal","遠端：筷子、扣子、拖鞋"],["bulbar","吞嚥/嗆咳/咀嚼"],["speech","講話/構音/鼻音"],["eye","複視/眼皮下垂/視物晃動"],["resp","喘/端坐呼吸"],["atrophy","肌肉萎縮/跳動/抽筋"],["myotonia","僵硬放不開/怕冷"]]],
 ["Sensory", [["numb","麻/痛/感覺異常"],["sataxia","閉眼洗臉晃/踩棉花/關燈走"],["saddle","會陰/擦屁股的感覺"],["lhermitte","低頭觸電感 (Lhermitte)"]]],
 ["Autonomic", [["oh","姿勢性頭暈/眼前發黑"],["urine","排尿：急尿/解不乾淨/失禁"],["bowel","排便/便秘"],["sex","性功能/晨勃"],["sweat","流汗"]]],
 ["EPS / 小腦", [["tremor","手抖"],["slow","動作變慢/僵硬"],["invol","不自主動作（甩/扭/抽）"],["fall","跌倒（方向/頻率）"],["coord","夾菜/按電梯對不準"]]],
 ["認知 / 精神 / 睡眠", [["memory","記憶/認知/ADL"],["psych","情緒/個性/幻覺"],["sleep","睡眠：RBD/嗜睡/失眠"],["seizure","癲癇/意識喪失"],["headache","頭痛/嘔吐"]]],
 ["特殊感官", [["vision","視力/夜盲/色覺"],["hearing","聽力/耳鳴/耳悶"],["smell","嗅覺"]]],
 ["ROS", [["constitutional","發燒/體重/盜汗/食慾"],["autoimmune","口乾眼乾/關節/紅疹/潰瘍"],["cardio","心悸/心臟病"],["gi","腹瀉/腸胃"],["other","流鼻血/慢性咳嗽/泡泡尿"],["endo","內分泌（甲狀腺/男性女乳/不孕）"]]],
 ["過去史", [["pmh","慢性病（三高/肝腎/癌症）"],["surg","手術/住院（胃切除？）"],["drug","用藥/中草藥/保健品"],["female","月經/懷孕/避孕"]]],
 ["個人史", [["abc","菸、酒、檳榔"],["toxin","職業暴露/笑氣/重金屬"],["tocc","旅遊/接觸/性史"]]],
 ["家族 / 發展史", [["fh","家族史（問三代）"],["consang","近親通婚/同姓"],["milestone","發展史/課業/體育/當兵"]]]
];

const NE_GROUPS = [
 ["觀察", [["obs","進場觀察/外觀/輔具"]]],
 ["認知", [["item3","3-item registration/recall"],["mmse","定向/計算/語言"],["cortical","額葉/頂葉：Luria、applause、apraxia"]]],
 ["腦神經", [["cn1","CN I 嗅覺"],["pupil","瞳孔/光反射/RAPD"],["fundus","眼底/KF ring/白內障"],["va_vf","視力/視野"],["eom","EOM/saccade/pursuit/nystagmus"],["ptosis","眼皮：curtain/sustained upgaze/Cogan"],["vest","前庭：head impulse/Fukuda"],["cn5","CN V 感覺/咀嚼肌"],["cn7","CN VII 閉眼/露齒/鼓頰"],["cn8","聽力/Rinne/Weber"],["bulbar_ne","Pa-Ta-Ka/uvula/gag/數1-20"],["tongue","舌頭：萎縮/顫動/力氣"],["cn11","SCM/trapezius/頸屈伸"]]],
 ["運動", [["bulk","肌肉外觀/萎縮/fasciculation"],["tone","張力（spasticity/rigidity）"],["mp_ul","上肢肌力"],["mp_ll","下肢肌力"],["scap","肩胛：winging/rhomboid/serratus"],["myot","Percussion/grip myotonia"],["fatig","疲勞測試（舉手20次/起蹲）"]]],
 ["反射", [["dtr_ul","上肢 DTR"],["dtr_ll","下肢 DTR + clonus"],["hoff","Hoffmann"],["babin","Babinski"],["jaw","Jaw jerk"],["other_reflex","腹壁/其他反射"]]],
 ["感覺", [["pp","Pinprick/sensory level"],["temp","溫度覺"],["jps","本體感覺 JPS"],["vib","震動覺"],["saddle_ne","會陰感覺/肛門反射"],["cortical_s","皮質感覺（stereognosis）"]]],
 ["協調", [["fnf","FNF/finger chasing"],["ram","RAM/rebound"],["hks","Heel-knee-shin"]]],
 ["錐體外 / 不自主", [["brady","Finger/foot tapping"],["rigid","Rigidity"],["tremor_ne","Tremor/spiral"],["invol_ne","Chorea/dystonia/myoclonus"],["pull","Pull test"]]],
 ["步態", [["gait","自然步態/轉身"],["tandem","Tandem gait"],["heeltoe","Heel/toe walk"],["romberg","Romberg"],["gower","雙手抱胸起立/Gowers"]]],
 ["其他", [["bp","臥/立位血壓"],["spine","脊椎/敲痛/前凸"],["skin","皮膚/毛髮"],["organ","頸部/甲狀腺/肝脾/心肺"],["meningeal","腦膜刺激徵"]]]
];

const HX_DEFAULT = {

 ans:{
  summary:"36 歲男性，自 5-9 歲 insidious onset、緩慢進展數十年的雙下肢僵硬、步態不穩，32 歲起用拐杖，伴隨急尿、解不乾淨、雙腳感覺鈍。NE：雙下肢 spasticity、近端輕度無力、knee/ankle hyperreflexia、雙側 clonus 與 Babinski，上肢正常（Hoffmann -），下肢 JPS/vibration 下降、Romberg (+)。",
  loc:"Spinal cord：bilateral corticospinal tracts + dorsal columns；上肢不受影響，定位在頸膨大以下（thoracic cord）。也符合 length-dependent 的長徑束退化（HSP）。",
  ddx:["Hereditary spastic paraplegia（pure / 輕度 complicated；台灣 AD 以 SPG4 最多，AR 可考慮 SPG5A、SPG11）","Vitamin B12 / copper deficiency（SCD）","Chronic infectious myelopathy：HTLV-1（HAM/TSP）、HIV vacuolar myelopathy、syphilis","Structural：intramedullary tumor、syringomyelia、spinal AVM/dAVF","Adrenomyeloneuropathy (X-ALD)、DRD（兒童期 spastic gait 應做 L-dopa trial）、SCA3、leukodystrophy"],
  work:["Spine MRI（T-spine 優先，必要時 C-spine）與 Brain MRI（thin corpus callosum = SPG11、white matter）","NCS/EMG、SSEP/MEP","B12、folate、homocysteine、MMA、copper、zinc、TSH","HTLV-1、HIV、VDRL/TPHA","VLCFA（ALD）、arginine","HSP gene panel（SPAST、ATL1、CYP7B1、SPG11、SPG7…）"],
  dx:"原始筆記未記載確定診斷；考生以 HSP（猜 SPG5A）為首要。",
  pearls:["脊髓病一定要做出 sensory level，前後側都要比。","問診必問近親通婚與家族三代，且男性多問母系。","兒童期發病的 spastic gait 要記得 DRD——它可以治療。","HSP 感覺通常正常或只有輕微 vibration 下降；感覺明顯異常要再想其他病因。"]

 q:[
  ["根據你的診斷，想優先排哪個檢查？","Spine MRI 優先（臨床定位 thoracic cord，排除 structural / compressive / intramedullary 病灶），再 Brain MRI；電生理 NCS/EMG 釐清有無周邊神經或 LMN；SSEP/MEP 確認後柱與皮質脊髓徑。"],
  ["除了影像，還要安排哪些抽血？","B12、folate、homocysteine、MMA、copper、zinc；HTLV-1、HIV、syphilis；TSH；VLCFA（AMN）；必要時 arginine。最後 HSP gene panel。"],
  ["Spinal cord 很長，你能再定位清楚一點嗎？影響脊髓的哪個部分？","縱向：上肢肌力、反射正常、Hoffmann (-)，所以在頸膨大以下的 thoracic cord（或 length-dependent 長徑束退化）。橫切面：bilateral lateral column（corticospinal tract）＋ posterior column（JPS、vibration），即後外側（posterolateral）受影響，spinothalamic 相對保留。"],
  ["如果是 structural lesion，比較像 extramedullary 還是 intramedullary？","無 radicular pain、無背痛、病程極長且對稱，較不像壓迫性病灶；若有病灶，intramedullary 優先於 extramedullary。Extramedullary 常有神經根痛、咳嗽加重的背痛、Brown-Séquard 型態；intramedullary 常 dissociated sensory loss、sacral sparing。"],
  ["剛才 NE 如果還有時間，應該加做什麼？","Sensory level（前後都要測）、溫度覺、heel/toe walk、Gowers、pull test、finger chasing、Pa-Ta-Ka 與 gag；仔細觀察 fasciculation 與遠端萎縮（complicated HSP 合併 neuropathy/amyotrophy）。"],
  ["病人是 spasticity 還是 rigidity？Gait 怎麼形容？是哪一種 ataxia？","Spasticity（velocity-dependent、clasp-knife）。Gait 為 spastic gait（剪刀、拖足、wide-based），加上 JPS、Romberg 異常的 sensory ataxia 成分，而非 cerebellar ataxia。"],
  ["為什麼 HSP 放第一，比較不像 subacute combined degeneration？","發病年齡極早（童年）、數十年緩慢進展；問診無吃素、胃腸手術、笑氣、營養不良等 B12 風險；SCD 通常 subacute，且常合併 neuropathy（ankle reflex 消失），此病人 ankle 反而 4+。"],
  ["為什麼比較不像 HTLV？哪些人比較會得 HTLV？HAM/TSP 跟 HSP 表現有何不同？","HTLV-1 傳染：母乳（垂直）、性行為、輸血、共用針頭；流行區包括日本南部、加勒比海、南美、非洲，台灣也有零星盛行區。HAM/TSP 多為成人（40-50 歲）、女性較多、無家族史，緩慢進展的 spastic paraparesis，早期就有明顯膀胱症狀、腰背痛與感覺異常；HSP 多為家族性、童年至青年發病、膀胱症狀較晚較輕。"],
  ["可能是哪一型 HSP？台灣最多是哪一型？若合併 polyneuropathy 會想哪一型？","台灣（與全世界）最多是 AD 的 SPG4（SPAST），其次 SPG3A（ATL1，常童年發病）；AR 中台灣報告以 SPG5A（CYP7B1）、SPG11 較多。合併 neuropathy：SPG11、SPG15（皆有 thin corpus callosum）、SPG7（合併 ataxia、optic atrophy）、SPG10（KIF5A）。"],
  ["怎麼解釋這個病人排便功能正常？","HSP 是 length-dependent 的 CST/後柱軸突退化，膀胱症狀（urgency）常見但通常較晚、較輕，排便功能多保留；這不代表 sacral sparing。真正的 sacral sparing（會陰感覺保留）是 intramedullary 病灶的線索，因 spinothalamic tract 中薦部纖維位於最外側。"]
 ],

 ans:{
  summary:"38 歲男性，無明顯主訴，因家族篩檢發現雙眼閉合不全；外觀消瘦、臉下半部與 masseter 萎縮。母親、大姨、大舅、外祖父有類似症狀（母親以吞嚥困難起始、眼閉不緊、笑不開、全身肌肉萎縮），姊姊與表親無症狀。NE：雙側 orbicularis oculi 無力（右>左）、masseter 萎縮，EOM full、無 ptosis，四肢肌力正常，反射正常，無 myotonia、無 winging。",
  loc:"Muscle（facial / masticatory muscles 為主的 myopathy），符合 AD 遺傳之 myopathy pattern（ptosis/facial weakness 類）。",
  ddx:["Oculopharyngeal / oculopharyngodistal myopathy（OPMD：PABPN1；OPDM：LRP12、GIPC1、NOTCH2NLC 之 CGG repeat，東亞常見）","FSHD（不對稱 facial weakness；需看 winging、TA、腹肌 Beevor）","Myotonic dystrophy type 1（facial、masseter 萎縮；需找 myotonia、白內障、禿頭、心律）","Centronuclear myopathy（DNM2，AD 成人型可有 facial 受影響）","其他：mitochondrial myopathy、late-onset Pompe（可治療，不能漏）"],
  work:["CK","NCS/EMG：myopathic MUP（短小、多相、early recruitment），找 myotonic discharge","Muscle MRI：fatty replacement 型態","基因：PABPN1、DMPK、FSHD（D4Z4）、OPDM repeat（LRP12/GIPC1/NOTCH2NLC）、DNM2","吞嚥攝影（VFSS）、PFT、ECG/Holter、心臟超音波","Genetic 無結果再考慮 muscle biopsy（rimmed vacuole、intranuclear inclusion）"],
  dx:"原始筆記最後一行寫「答案說是 Sialidosis」。這與臨床表現不太吻合，可能是筆記誤植，來源未經證實，僅供參考。",
  pearls:["病人說「沒有不舒服」時，要溫和追問，並馬上轉向家族史問「家人有什麼症狀」。","家族史中母親、外祖父皆受影響：父傳子、母傳子都可，且女性也發病，基本排除 X-linked（例如 SBMA）。","Facial myopathy 一定要檢查：ptosis、EOM、閉眼力、吹口哨、tent-shaped mouth、masseter、scalene/SCM、winging、TA、myotonia、心臟與吞嚥。"]

 q:[
  ["家族史中，大舅、大姨幾歲發病？首發症狀一樣嗎？","應逐一追問每位患病家屬的發病年齡、首發症狀（吞嚥、ptosis、閉眼、肢體）、進展速度、是否需要胃管/呼吸器、死因，以判斷遺傳型態與 anticipation。"],
  ["這些 muscle 疾病很多是 repeat expansion disorder，你認為有沒有 anticipation？","病人 38 歲，症狀可能更早出現，可能較上一代早發，有 anticipation 的可能；但外祖父發病年齡不明，且姊姊、表親無症狀，需要更多資訊。DM1（CTG）、OPDM（CGG）有 anticipation；OPMD 的 GCN repeat 很短，通常沒有明顯 anticipation。"],
  ["你怎麼從家族史判斷是 muscle 而不是 nerve？","家屬表現對稱、以 facial 與 bulbar 開始、全身肌肉緩慢萎縮且病程很長；若為 bulbar-onset ALS，病程應快速致命；PMA 少有如此強的 AD 家族史；SBMA 為 X-linked，女性（母親、大姨）通常不發病。病人本身無 fasciculation、反射正常、無感覺異常。"],
  ["有沒有可能是 metabolic 或 mitochondrial myopathy？","要考慮。Late-onset Pompe 是 treatable myopathy，一定要排除（dried blood spot GAA）；mitochondrial（CPEO、KSS）表現多樣，常有 ptosis/EOM 限制、運動不耐、多系統。"],
  ["你覺得他有沒有 tent-shaped mouth？有沒有 lumbar lordosis？scalene 有沒有肥大？","應實際描述檢查所見並說明意義：tent-shaped mouth 見於 DM1 等嚴重 facial weakness；lumbar hyperlordosis 見於 FSHD、近端 myopathy；考官認為病人轉頭時 scalene 較粗，代償性肥大可見於部分 muscular dystrophy。"],
  ["你認為他有 distal weakness 嗎？","沒有：四肢遠端肌力 5/5，on toe/on heel 正常，thenar、ADM、1st DIO 飽滿。"],
  ["有沒有可能是 myotonic dystrophy？最不像的理由是什麼？","DM1：應有 distal weakness、frontal baldness、grip/percussion myotonia、白內障、心律不整、嗜睡，病人皆無。DM2：以 proximal weakness、肌肉痛為主，病人近端正常。但 facial 與 masseter 萎縮仍與 DM1 相符，EMG 找 myotonic discharge 與 DMPK 檢測仍有價值。"],
  ["你提了 centronuclear myopathy，但它不都是 infantile onset 嗎？","多數早發，但 DNM2 相關的 AD 型可在成人發病、進展緩慢，可有 ptosis、facial weakness、EOM 受限與遠端無力，仍可列入鑑別。"],
  ["最優先排什麼檢查？NCS/EMG 預期看到什麼？要做 biopsy 嗎？","先做 NCS/EMG（分辨 nerve vs muscle）與 CK，再 muscle MRI 看型態。EMG 預期 myopathic MUP：短、小、多相、early recruitment；NCS 的 CMAP 可略低、SNAP 正常。Biopsy 為侵入性，先做 genetic study，陰性再做。"]

  ["IBM 的吞嚥困難機轉與處理？","Cricopharyngeal muscle 功能異常與咽部肌肉無力。處理：飲食調整、吞嚥訓練、cricopharyngeal myotomy、botulinum injection、擴張、嚴重時胃造口。"],

<p>發燒/URI/UTI、體重減輕、食慾、盜汗、口乾眼乾、口腔潰瘍、紅疹、關節腫痛、視力、聽力、嗅覺；流鼻血（NPC、cANCA）、喘（TB、ANCA-ILD、sarcoidosis）、泡泡尿（ANCA）。</p>
<h3>過去史 / 個人史</h3>
<p>三高、肝腎甲狀腺、癌症（化放療）、手術（胃）、白內障；藥物（中草藥、避孕藥、娛樂用藥、笑氣）；女性月經、懷孕；疫苗；TOCC（旅遊、創傷、寵物/野外/蟲咬、群聚）；職業暴露（重金屬、殺蟲劑、染劑）；ABC（菸酒檳榔）。</p>
<h3>家族史 / 發展史</h3>
<p>父母死因、同輩晚輩，問到三代，發病年紀/性別/症狀；近親通婚、收養；男性多問母系。發展里程碑「7 坐 8 爬 10 站 1 走 2 跑」、課業、體育、當兵、幼時腦膜炎。</p>`},
 {id:"ne", name:"標準 NE 流程", html:`
<ol class="steps">
<li><b>3-item</b>（紅色、快樂、腳踏車）；可加 100-7、人時地、命名、repeat</li>
<li><b>CN</b>（口罩整個拿掉）：CN I 鼻孔各一；pupil/LR/RAPD、眼底、VA 先 VF 後；EOM「米」字、saccade＋pursuit（水平垂直）、nystagmus；CN V temporalis＋masseter；CN VII 露齒閉眼鼓頰（記得扒開眼睛）；Pa×5、Ta×5、Ka×5、PaTaKa、數 1-20；uvula＋gag；舌頭 rest/伸出/左右/頂臉頰</li>
<li><b>站到身後</b>：CN VIII（Rinne、Weber）、CN XI（SCM、trapezius）、頸屈伸（先問頸部外傷）、Lhermitte</li>
<li><b>3-item again</b></li>
<li><b>起身（抱胸）</b>：自然步態、tandem、heel/toe walk、Romberg（腳尖併攏）、pull test。PN/movement 要脫鞋，看 EDB</li>
<li><b>坐著測上肢</b>：翻開看 muscle bulk、fasciculation、皮膚；tone；MP；FNF＋RAM＋finger tapping；DTR＋Hoffmann＋jaw jerk；distal weakness 要敲 percussion myotonia</li>
<li><b>躺下測下肢</b>：MP（可加 hip abd/add）、DTR、AJ、Babinski、clonus、HKS（褲管拉高）、tone</li>
<li><b>感覺</b>：pinprick（找 level，左右、近遠、前後）、JPS、vibration（手指 1、腳趾）、light touch、溫度</li>
<li><b>起身補做</b>：Gowers、Beevor、winging（雙手插腰、推牆）、rhomboid、scoliosis；finger/foot tapping；tremor（rest/postural/kinetic）；frontal release（glabellar、palmomental）、Luria、applause</li>
</ol>
<h3>依情境加做</h3>
<ul><li><b>MG 系列</b>：sustained upgaze/lateral gaze 1 分鐘、眨眼十下、curtain sign、Cogan lid twitch、單手上下 20 次、深吸氣大聲數數、長音「eee」、起立蹲下五次</li><li><b>Movement</b>：寫字畫圈、spiral、倒退走、sensory trick、mirror movement、motor impersistence（milkmaid grip、trombone tongue）、肝脾、KF ring、UPDRS/SARA 做一輪</li><li><b>Myelopathy</b>：前後 sensory level、sacral sparing、Lhermitte、abdominal reflex</li><li><b>Neuropathy</b>：high-arched foot、EDB atrophy、nerve thickening</li><li><b>Cognition</b>：clock drawing、MoCA 立方體、摺紙、naming、gesture、Luria、applause</li><li><b>Vertigo</b>：HINTS、head impulse、Fukuda</li></ul>`},
 {id:"neuropathy", name:"Neuropathy", html:`
<h3>六個關鍵問題</h3>
<ol><li>涉及哪些系統？Motor predominant → Template 1；sensory predominant / sensory ataxia → Q3</li><li>無力分布？近端要加 myopathy/NMJ；不對稱 → Template 3（遠端：single/multiple nerves；近端＋遠端：root 或 plexus）</li><li>感覺性質？劇痛燒灼（small fiber）→ Template 4/5；本體感覺（posterior column）→ Template 2</li><li>有無 UMN？不對稱 pure motor → ALS；對稱 pure motor＋小腦 → adult Tay-Sachs；對稱 motor＋sensory → B12/Cu、leukodystrophy</li><li>時間演進</li><li>遺傳證據？不要忘記 CMT、SMA</li></ol>
<h3>十個 Pattern</h3>
<table><tr><th>Pattern</th><th>表現</th><th>想到</th></tr>
<tr><td>1</td><td>對稱近端＋遠端無力＋感覺</td><td>GBS、CIDP</td></tr>
<tr><td>2</td><td>對稱遠端感覺 ± 遠端無力</td><td>DM、甲狀腺、藥物、毒物、CMT</td></tr>
<tr><td>3</td><td>不對稱遠端無力＋感覺</td><td>Vasculitis（ANCA）、sarcoidosis、MADSAM、Lyme、HBV/HCV</td></tr>
<tr><td>4</td><td>不對稱近端＋遠端無力＋感覺</td><td>DM amyotrophy、meningeal carcinomatosis、lymphomatosis、amyloid、HNPP</td></tr>
<tr><td>5</td><td>不對稱遠端無力、無感覺</td><td>UMN+ → ALS/PLS；UMN- → MMN、PMA、acute flaccid myelitis</td></tr>
<tr><td>6</td><td>對稱感覺＋遠端 areflexia＋UMN</td><td>B12、Cu、Zn</td></tr>
<tr><td>7</td><td>對稱無力、無感覺</td><td>AMAN、motor CIDP、SMA、HMN、myopathy/NMJ</td></tr>
<tr><td>8</td><td>局部中線近端對稱無力</td><td>ALS（也想 myopathy/NMJ）</td></tr>
<tr><td>9</td><td>不對稱本體感覺喪失、不無力</td><td>Ganglionopathy：Sjögren、paraneoplastic</td></tr>
<tr><td>10</td><td>自律神經症狀</td><td>Template 5</td></tr></table>
<h3>Template 重點</h3>
<ul><li><b>T1 Motor</b>：toxin（lead、vincristine、dapsone、organophosphate）、感染（polio、EV-D68/A71、WNV、JEV、VZV、HIV）、AMAN、MMN、DM amyotrophy、porphyria、CMT、SMA、SBMA、Hirayama、ALS/PMA；急性＋自律神經 → GBS、porphyria</li><li><b>T2 Sensory ataxia</b>：PN（taxane、metronidazole、arsenic、thallium、anti-MAG、MGUS、HSAN）；DRG（doxorubicin、thalidomide、mercury、paraneoplastic Hu/CV2、B6、Sjögren、HIV、CANOMAD、MFS、CANVAS）；roots（CISP、Lyme）；PC（MS、NMO）；mixed（syphilis、B12、Cu、sarcoid）</li><li><b>Vitamin 大混戰</b>：B1 缺（Wernicke、S-M neuropathy）；B6 缺（seizure、sensory poly）、多（sensory neuronopathy）；B12 缺（PN＋後側柱＋UMN）；E 缺（sensory neuronopathy＋spinocerebellar）</li><li><b>T5 Autonomic</b>：vincristine、taxane、NMO（hypothalamus）、Wernicke、AAG（nAChR-α3）、LEMS、anti-Hu、MSA、PD、FFI、SCA12；痛＋自律神經：GBS、amyloidosis、porphyria、SS、SLE、HIV、HSAN、DM</li></ul>`},
 {id:"myopathy", name:"Myopathy / NMJ", html:`
<h3>六個關鍵問題</h3>
<ol><li><b>Positive / negative 症狀</b>：exercise intolerance（短時間高強度＋second wind → McArdle；長時間、禁食、寒冷 → CPT II）；contracture（Brody、glycolytic defects、hypothyroid）；myalgia；stiffness（myotonia）；myoglobinuria</li><li><b>時間演進</b>：嬰兒（CMD）、兒童（central core、centronuclear、nemaline、GSD）、兒童到成人（mitochondrial、dystrophy、metabolic）、成人（IIM：IBM、IMNM、ASS、DM；toxic：alcohol、steroid、colchicine）</li><li><b>家族史</b>：XL（DMD/BMD、EDMD）、AD（FSHD、OPMD、DM、LGMD1、PMC）、AR（LGMD2、metabolic、Becker MC）</li><li><b>誘發因子</b>：發燒（CPT）、寒冷（PMC）、運動（PMC）、運動後休息（hyper/hypoKPP）、碳水（hypoKPP）、禁食（hyperKPP）、鉀（hyperKPP、PMC）</li><li><b>全身表現</b>：心律不整（ATS、KSS、LGMD1B、EDMD、DM、anti-SRP）、心衰竭（Pompe、DMD/BMD、sarcoglycan）、呼吸衰竭（DMD、EDMD、LGMD2A/2I、DM、Pompe）、肥大/假性肥大（捏小腿）、scapular winging</li><li><b>無力分布 pattern</b>（見下）</li></ol>
<h3>無力分布</h3>
<ul><li><b>Pattern 2 遠端</b>：先排除 motor neuropathy；DM1、IBM、myofibrillar、Miyoshi、Nonaka、Welander、Laing、Udd</li><li><b>Pattern 3 scapuloperoneal</b>：FSHD、EDMD、部分 MFM、Pompe、LGMD2A</li><li><b>Pattern 4 遠端上肢＋近端下肢</b>：IBM（DM1 少見）</li><li><b>Pattern 5 ptosis/ophthalmoplegia</b>：＋EOM：CPEO、OPMD、OPDM、MG、botulism、centronuclear；－EOM：DM1、desmin、FSHD、congenital</li><li><b>Pattern 6 neck extensor</b>：MG、IBM、IMNM、FSHD、DM1、Pompe、ALS、甲狀腺/副甲狀腺、低鉀</li><li><b>Pattern 7 bulbar</b>：MuSK-MG、LEMS、botulism、GBS-PCB、ALS、SBMA；myopathy 中 IBM > IMNM > OPMD > mitochondrial > SLONM</li></ul>
<h3>Acquired（ACDE）</h3>
<p>Alcohol、Classic IIM、Drug（statin、colchicine、steroid、HCQ、zidovudine、amiodarone）、Endocrine。必問：藥物、疹子、DM、甲狀腺/腎上腺、酒精。皮疹：heliotrope、V/shawl sign、Gottron、mechanic's hands；ILD（MDA5、PL7/PL12）；癌症（NXP-2、TIF-1γ）。</p>
<h3>Myotonia</h3>
<p>Clinical：DM1（遠端）、DM2（近端、肌痛）、MC（Thomsen AD/Becker AR，warm-up 改善）、PMC（寒冷、運動惡化）、hyperKPP。EMG 才有：IIM、colchicine、statin、HCQ、cyclosporine、centronuclear、Pompe、McArdle、severe axonal neuropathy。</p>`},
 {id:"ataxia", name:"Ataxia", html:`
<ol><li><b>先排除 sensory ataxia</b>：走路像踩棉花、stomping gait、暗處加重 → neuropathy Template 2</li><li><b>病程與病因（VITAMMIN-CD）</b><ul><li>Acute：stroke、AVM；VZV、EBV、enterovirus、influenza；lithium、Hg、Pb、Tl、Mn、toluene；MS；AED、BZD、5-FU、metronidazole</li><li>Subacute：hypothyroidism、hypoparathyroidism（Fahr）；MFS、anti-GAD65（眩暈可先出現 3 個月）、SREAT；paraneoplastic（Yo、Tr、mGluR1、RGS8 為 pure ataxia；Hu、Ri、Ma2、CRMP-5 合併其他）；gluten 更慢</li><li>Chronic：hereditary、MSA</li></ul></li><li><b>伴隨神經症狀</b><ul><li>4D：diplopia、dysphagia、dysarthria、dyspnea</li><li>Seizure：PMA/PME、POLG、SCA2/7/10/17</li><li>RP：KSS、NARP、AVED、PKAN、Refsum、SCA7；cataract：CTX、MSS</li><li>Sensory 為主：FRDA、SANDO、AVED、CANVAS、FXTAS、SCA4/25；sensorimotor：AT、AOA1/2、GM2、ARSACS、CTX、SCA1-3、NIID、Refsum</li><li>Autonomic：SCA2/3、CANVAS、NIID、FXTAS、GM2</li></ul></li><li><b>全身症狀</b>：體重減輕（paraneoplastic）、營養（alcohol、B1/E/B12）、腹瀉（Whipple、celiac、DPPX、CTX、AVED）、慢性咳嗽（CANVAS）、皮膚（SCA34、CTX 黃色瘤、telangiectasia）、藥物毒物、甲狀腺</li></ol>
<h3>SCA 速記</h3>
<ul><li>Pure ataxia：SCA6（downbeat nystagmus）、5、11、15、26、31</li><li>發病年齡：童年 SCA7、13、DRPLA；年輕成人 SCA1-3；老年 SCA6、17</li><li>CAG：1、2、3、6、7、17、DRPLA</li><li>Parkinsonism：SCA2、3、17；dementia：SCA12、13、17、DRPLA；RP：SCA7</li></ul>
<h3>小腦定位</h3>
<p>Vermis（anterior）：軸性/步態；hemisphere（posterior）：同側肢體；flocculonodular：眩暈、眼動。</p>`},
 {id:"parkinson", name:"Parkinsonism", html:`
<ol><li><b>時間軸</b>：急/亞急性 → 藥物、感染（HIV、JE、CJD、cryptococcus）、中風；進展速度判斷 atypical</li><li><b>Non-motor</b>：至少問 hyposmia、憂鬱、RBD、便秘；自律神經（OH、尿失禁、ED）要問距發病多久</li><li><b>Red flags（1+5+1+3）</b>：3 年內跌倒；5 年內 BAANG（bulbar、absence of motor progression、absence of non-motor、autonomic、gait/輪椅）；10 年內 anterocollis；stridor、對稱、pyramidal sign</li><li><b>Motor 線索</b>：往後跌 → PSP-alike；下肢為主 → vascular、NPH；早期 bulbar＋自律神經 → MSA-alike；dystonia/myoclonus＋皮質徵 → CBS-alike</li><li><b>VITAMEN-D</b>：stroke、SDH；HIV、JE、CJD；paraquat、rotenone、Mn、Hg；SLE、MS/NMOSD；hepatocerebral、POLG、Leigh、SREAT；Na（EPM）、hypothyroid；Ma2、IgLON5、CRMP5、Ri；抗精神病藥、止吐藥、flunarizine</li><li><b>發病年齡</b>：<20 歲 juvenile PD；20-40 YOPD（進展慢、藥效好但易 dyskinesia、dystonia、精神症狀）</li></ol>
<h3>Look-alikes</h3>
<ul><li><b>PSP</b>：排除 leukoencephalopathy、NPH、infarction、tumor、CADASIL、prion；<45 歲：Wilson、NPC、hypoPTH、neuroacanthocytosis、neurosyphilis；Ma2、IgLON5；genetic（MAPT、Perry、Kufor-Rakeb）</li><li><b>MSA</b>：acquired（ataxia 模板、anti-Hu 合併自律神經）；genetic（C9orf72、SCA2/3、NIID、FXTAS、CTX、CANVAS、GM2）</li><li><b>CBS</b>：stroke、APS、SREAT、autoimmune、neurosyphilis、Whipple</li></ul>
<p>平均發病年齡：MSA 50 < PD 60 < PSP/CBD 65 < DLB 70。</p>`},
 {id:"dystonia", name:"Dystonia", html:`
<ol><li><b>先確定是 dystonia</b>：patterned、overflow、sensory trick（必問）、mirror movement</li><li><b>其他細節</b>：躺下確認非 skeletal；頸部各方向活動與疼痛、tender point；SCM 肥大（摸纖維化）；cervical dystonia 看 shoulder elevation、轉頭方向、SCM；leg dystonia 叫病人倒著走</li><li><b>伴隨症狀</b>：肝炎/黃疸家族史（Wilson）、藥物、視聽、癌症、levodopa 反應（DRD）、自律神經、免疫</li><li><b>VITAMEN-D</b>：BG stroke、AVM；toxoplasmosis、JE、SSPE；CO、CS₂、methanol；NMOSD；LHON-plus、Leigh；Na、Ca（Fahr）、Fe（NBIA）、甲狀腺；Ri（jaw dystonia）、LGI1（FBDS）；抗多巴胺藥</li><li><b>遺傳紅旗</b>：兒童 cranial onset、成人 leg onset</li></ol>
<h3>組合</h3>
<ul><li>Isolated：leg onset → DYT-TOR1A；craniocervical → DYT-THAP1</li><li>＋chorea：Wilson、NBIA、neuroacanthocytosis；＋ataxia → AT、AOA、SCA</li><li>＋myoclonus：SGCE（酒精反應佳）、KCTD17、CBD、MSA</li><li>＋parkinsonism：DRD（GCH1）、TAF1、ATP1A3、PRKRA；PRKN/PINK1/DJ-1；SCA2/3/17</li><li>＋epilepsy：GLUT-1、Leigh、BPAN、ATP1A3</li></ul>`},
 {id:"chorea", name:"Chorea / Myoclonus", html:`
<h3>Chorea</h3>
<p>思路同 ataxia：先排除 acquired，再想遺傳。</p>
<ul><li><b>AD</b>：HD、HDL1-3；合併 ataxia → SCA1/2/3/17、DRPLA、neuroferritinopathy</li><li><b>AR</b>：vertical gaze palsy → NPC；oculomotor apraxia → AT/AOA；neuropathy/cardiomyopathy/epilepsy → neuroacanthocytosis；anemia → aceruloplasminemia、Wilson</li><li><b>分布</b>：口顏面（TD、HD、chorea-acanthocytosis 咬舌）、hemichorea（血管、高血糖、toxoplasmosis）、軀幹（ADCY5）</li><li><b>病程</b>：急性（stroke、HIV、toxo、CO、SLE/APS、藥物）；亞急性（porphyria、甲亢、hypoPTH、肝腎衰竭、NMDA、LGI1、CASPR2、D2R、IgLON5、CRMP-5、Hu）</li><li><b>伴隨</b>：精神（HD、Wilson）、DM（NKH hemichorea）、SLE/APS、小孩（Sydenham、ADCY5、BHC）、孕婦（chorea gravidarum）</li></ul>
<h3>Myoclonus</h3>
<ul><li>Key questions：negative myoclonus？刺激誘發？睡覺持續？躺下誘發？</li><li>Acute：brainstem stroke（palatal）、thalamic、Lance-Adams；HSV/HIV/CJD；bismuth、lithium、SSRI、opioid、AED；NMDA、LGI1</li><li>Subacute-chronic：肝腎衰竭、甲亢、低血鈉、低血糖；SSPE、SREAT；neuroblastoma、Hu、Ri</li><li>Genetic：找 PMA/PME 證據——seizure、視力（CLN、sialidosis cherry-red spot）、EOM（NPC 垂直、Gaucher 水平）</li><li>Spiral drawing：tremor 有軸；myoclonus 為不規則 spike</li></ul>`},
 {id:"myelopathy", name:"Myelopathy", html:`
<p><b>重點：NE 時間分配要大於 history。</b></p>
<h3>粗略定位</h3>
<ul><li>Complete transection：motor、sensory、autonomic 皆受影響</li><li>Central cord：上肢 > 下肢＋自律神經 → 問頸部過伸傷</li><li>Anterior cord：只保留本體/震動 → 問頸部屈曲傷、ASA infarction</li><li>Posterolateral：無力＋sensory ataxia → B12、FRDA；只有後柱 → syphilis</li><li>Brown-Séquard：問洗澡冷熱分邊、踩地感、關燈走路</li></ul>
<h3>病灶位置</h3>
<ul><li>Saddle anesthesia 存在 → extramedullary；保留（sacral sparing）→ intramedullary</li><li>Radicular pain、咳嗽加重、敲痛 → extramedullary</li><li>Dissociated sensory loss → intramedullary</li><li>膀胱：pons 以上 urge；pons-L1 urge＋overflow（DSD）；L1 以下 overflow；conus 早期 LMN bladder</li><li>Horner（C8-T2）、雙側 Horner → syringomyelia</li><li>與 polyneuropathy 區分：真正 sensory level vs escutcheon sign（測前後）</li><li>與 ALS 區分：LMN signs 在 UMN signs 的尾側</li></ul>
<h3>病因（VITAMIN-CD）</h3>
<table><tr><th>類別</th><th>疾病</th></tr>
<tr><td>Vascular</td><td>Spinal infarction、AVM、dAVF（運動惡化、急尿）</td></tr>
<tr><td>Infection</td><td>Epidural abscess、TB、HIV、HTLV（HAM/TSP）、syphilis、enterovirus（flaccid）</td></tr>
<tr><td>Toxin/Drug</td><td>N₂O、Cu 缺乏/Zn 過量、organophosphate、IT chemo、heroin、lathyrism、konzo</td></tr>
<tr><td>Autoimmune</td><td>NMOSD、MS、MOGAD、ADEM、SLE/APS、Sjögren、sarcoidosis、Behçet</td></tr>
<tr><td>Metabolic</td><td>B12、folate、copper、vitamin E</td></tr>
<tr><td>Neoplastic</td><td>原發腫瘤、轉移（幾乎都 extradural）、paraneoplastic（Hu、CRMP5、amphiphysin）、parasagittal meningioma</td></tr>
<tr><td>Hereditary</td><td>HSP（SPG4 最多；AR：SPG5、11）、ALD/AMN、Krabbe、MLD、PLS</td></tr>
<tr><td>Degenerative</td><td>HIVD、spondylosis、OPLL、syringomyelia、Chiari</td></tr></table>
<h3>必問</h3>
<p>吃素、胃手術、笑氣、輸血、性史；Lhermitte、NMOSD（頑固打嗝、視神經炎）；口乾眼乾、放療、腫瘤、外傷；皮膚變黑、早禿、性功能（ALD）；complicated HSP 問視力、聽力、認知。</p>`},
 {id:"cn", name:"Multiple CN", html:`
<p><b>永遠先排除 NMJ 與 GBS。</b></p>
<h3>病因</h3>
<ul><li><b>Vascular</b>：腦幹中風症候群；aneurysm（CN III → Pcom/ICA、SCA；CN IV/VI → cavernous sinus）；CC fistula（單側、bruit、紅眼）vs cavernous sinus thrombosis（急性、雙側）；dissection（必問 Horner）；pituitary apoplexy</li><li><b>Infection</b>：腦膜發炎（bacterial、TB、Lyme）、HIV、VZV</li><li><b>Trauma</b>：顱底骨折</li><li><b>Autoimmune</b>：Sjögren（CN V ganglionopathy）、SLE（CN VI）、Behçet（VI、VII）、GPA（VI>VII>V，流鼻血）、IgG4-RD vs Tolosa-Hunt</li><li><b>Metabolic</b>：DM（pupil-sparing CN III）、Wernicke、Graves、CPEO/KSS（非神經麻痺）、abetalipoproteinemia</li><li><b>Inflammatory</b>：GBS/MFS、NMOSD（INO）、sarcoidosis（VII/VIII > II > V）</li><li><b>Neoplastic</b>：NPC、顱底腫瘤、轉移、carcinomatosis；Paget（>55 歲男性，CN VIII）；amyloid/superficial siderosis</li></ul>
<h3>解剖線索</h3>
<ul><li>CN III → aneurysm、cavernous sinus（＋IV、V1、VI）</li><li>V＋VI → petrous apex（Gradenigo：中耳炎）、Sjögren</li><li>VI＋VII → pons（Millard-Gubler、Raymond）；從小 → Möbius</li><li>VII＋VIII → 內聽道（schwannoma、sarcoid、siderosis、Paget）</li><li>IX-XI ± XII、交感 → Vernet、Collet-Sicard、Villaret</li><li>CN 分散很遠 → 腦膜（meningitis、leptomeningeal seeding）</li></ul>
<h3>必問</h3>
<p>酒精（Wernicke）、流鼻血/鼻塞（NPC）、Horner（眼皮、汗）、頭痛嘔吐、紅眼（聽 bruit）、癌症史、上呼吸道感染或腹瀉（GBS/MFS）、性行為。</p>`},
 {id:"dementia", name:"Dementia / 高階皮質", html:`
<h3>問診</h3>
<ul><li>影響日常生活/工作多久？突然或慢慢？是否在生活事件後發生</li><li><b>Memory</b>：immediate（DLPFC）、short-term（hippocampus）、long-term</li><li><b>Language</b>：nfvPPA（講話吃力停頓）、svPPA（物體語意錯誤）、lvPPA（找字困難、無法複述）</li><li><b>Behavior</b>：bvFTD 去抑制、apathy、愛吃甜、儀式行為</li><li><b>Visuospatial</b>：PCA、Gerstmann、Balint</li><li><b>Executive</b>：CBS（apraxia、cortical sensory loss、alien limb）</li><li><b>Neuropsychiatric</b>：DLB（視幻覺、波動、RBD）</li><li>藥物：抗膽鹼（oxybutynin、抗組織胺、meclizine、benztropine）、AED、BZD、抗精神病、lithium、TCA、metronidazole、cefepime</li></ul>
<h3>高階皮質功能檢查</h3>
<ul><li><b>Frontal</b>：glabellar、applause、Luria、摺紙（executive）、倒念 142857（attention）、verbal fluency</li><li><b>Parietal</b>：比 OK/讚、模仿手勢、梳頭（apraxia）、摸錢（astereognosis）、畫時鐘、立方體</li><li><b>Temporal</b>：記憶、語意、臉孔辨識</li><li><b>Occipital</b>：Balint、achromatopsia、hemianopia</li><li><b>Language</b>：comprehension、fluency、reading、writing、naming、repetition（你好 → 今天有你真好）</li></ul>
<p>平均發病年齡：FTD 40-60 < PCA 60 < CBD、AD 65 < DLB 70。</p>
<h3>RPD 鑑別</h3>
<p>sCJD、autoimmune encephalitis、metabolic、infection（HSV、syphilis、HIV）、Wilson、HD、strategic stroke、lymphoma、藥物毒物。</p>`},

  ["SCA3 的臨床特徵與分型？","ATXN3 CAG repeat（polyQ）。Type 1：早發、明顯 pyramidal 與 dystonia；Type 2：中年、ataxia＋pyramidal；Type 3：晚發、ataxia＋peripheral neuropathy/amyotrophy；Type 4：parkinsonism。常見 bulging eyes（eyelid retraction）、faciolingual fasciculation、眼動受限、RLS、睡眠障礙。"],

  ["她 12 歲的女兒能不能做基因檢測？","未成年無症狀者原則上不做預測性基因檢測，等成年後經完整遺傳諮詢、本人知情同意再決定；有症狀時才做診斷性檢測。"],

 q:[
  ["Neuralgic amyotrophy 的誘因與病程？","誘因：感染（包括 hepatitis E）、疫苗、手術、生產、劇烈運動、免疫治療。典型為急性劇痛數天至數週，痛減輕後出現無力與萎縮，恢復需數月至數年，部分殘留。"],

  ["治療？","早期（2-4 週內）可考慮口服類固醇縮短疼痛期；止痛（NSAID、opioid、neuropathic pain 藥物）；物理治療維持關節活動度；嚴重或無恢復者可考慮神經手術（hourglass constriction）。"],
  ["Hereditary neuralgic amyotrophy 有什麼線索？","家族史、反覆發作、年輕發病、輕微 dysmorphic features（hypotelorism、cleft palate、skin fold），SEPT9 突變（AD）。"]

function gContents(input){
 const turns = typeof input==="string" ? [{role:"user",content:input}] : input;

 for(const t of turns){ const role=t.role==="assistant"?"model":"user"; const last=out[out.length-1];
  if(last && last.role===role) last.parts[0].text += "\n\n"+t.content; else out.push({role, parts:[{text:String(t.content)}]}); }

function gErr(status, body){

function makeGemini(){

  const body = {contents:gContents(input), generationConfig:{temperature: json?0.7:0.8}};
  if(json) body.generationConfig.responseMimeType="application/json";
  const stream = !!opts.onText && !json;
  let res;
  try{
   res = await fetch(base()+(stream?":streamGenerateContent?alt=sse":":generateContent"), {method:"POST", signal:opts.signal,
    headers:{"Content-Type":"application/json","x-goog-api-key":G.key}, body:JSON.stringify(body)});
  }catch(e){ throw {code: e && e.name==="AbortError" ? "cancelled" : "upstream_error", message:String(e)}; }
  if(!res.ok) throw gErr(res.status, await res.text());
  if(!stream){
   const d = await res.json();
   const text = (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
   if(!text) throw {code:"empty_completion", message:"Gemini 沒有回覆"+(d.promptFeedback?.blockReason?`（${d.promptFeedback.blockReason}）`:"")};
   if(opts.onText) opts.onText({text, delta:text});

  }
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf="", text="";
  try{
   for(;;){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf("\n"))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
     if(!line.startsWith("data:")) continue; try{ const d=JSON.parse(line.slice(5)); const delta=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      if(delta){ text+=delta; opts.onText({text, delta}); } }catch(e){} } }
  }catch(e){ throw {code: e && e.name==="AbortError" ? "cancelled" : "upstream_error", message:String(e), text}; }
  if(!text) throw {code:"empty_completion", message:"Gemini 沒有回覆"};
  return text;
 }

}

function aiErr(e){
 const c = e && e.code;
 if(c==="bad_key") return "Gemini 金鑰無效，請到「AI 設定」檢查。"; if(c==="bad_model") return "找不到設定的 Gemini 模型，請到「AI 設定」修改模型名稱。"; if(c==="empty_completion") return "Gemini 沒有回覆，請換個說法再試。";
 if(c==="rate_limited") return "AI 使用太頻繁，請稍後再試。";
 if(c==="cancelled") return "";
 if(c==="invalid_json") return "AI 回覆格式有誤，請再問一次。";
 return "AI 暫時沒有回應，請再試一次。";
}

/* ---------- 計時與音效 ---------- */
let actx = null;
function beep(n=1){
 if(!S.persist.settings.sound) return;
 try{
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){
   const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
   const t=actx.currentTime+i*0.35; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.start(t); o.stop(t+0.3);
  }
 }catch(e){}
}
function fmt(sec){ const neg=sec<0; sec=Math.abs(Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return (neg?"+":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function remaining(){
 const E=S.persist.exam; if(!E) return 0;
 const dur = (E.phase==="enc"? E.enc : E.exq)*60;
 return dur - (Date.now()-E.phaseStart)/1000;
}
function startTick(){
 clearInterval(tick);
 tick = setInterval(() => {
  const E=S.persist.exam; if(!E || E.phase==="done"){ clearInterval(tick); return; }
  const r = remaining();
  const key = E.phase;
  E.warned = E.warned || {};
  if(r<=300 && !E.warned[key+"5"]){ E.warned[key+"5"]=1; beep(2); save(); }
  if(r<=60 && !E.warned[key+"1"]){ E.warned[key+"1"]=1; beep(3); save(); }
  if(r<=0 && !E.warned[key+"0"]){ E.warned[key+"0"]=1; beep(4); save(); }
  const el=$("#clock"); if(el){ el.textContent=fmt(r); el.className="clock"+(r<=0?" over":r<=300?" warn":""); }
  const b=$("#bellslot"); if(b){ b.innerHTML = r<=0? `<div class="bell red">時間到。${E.phase==="enc"?"請停止檢查，準備報告。":"考官提問時間結束。"}</div>` : r<=60? `<div class="bell red">剩下一分鐘。</div>` : r<=300? `<div class="bell">剩下五分鐘。</div>` : ""; }
 }, 500);
}

/* ---------- 考試流程 ---------- */
function startExam(){
 const st=S.persist.settings;
 let id = st.mode==="pick" ? st.pick : null;
 if(!id){
  const done = new Set(S.persist.records.map(r=>r.caseId));
  const base = CASES; // 隨機抽題只抽內建題
  const pool = base.filter(c=>!done.has(c.id));
  const from = pool.length? pool : base;
  id = from[Math.floor(Math.random()*from.length)].id;
 }
 S.persist.exam = {caseId:id, hidden: st.mode!=="pick", enc:+st.enc||40, exq:+st.exq||20, phase:"enc", phaseStart:Date.now(), started:Date.now(),
  asked:[], done:[], log:[], notes:"", pres:{summary:"",loc:"",ddx:"",work:""}, qi:0, qshow:false, qrate:{}, qans:{}, chat:[], examMode:"bank", warned:{}};
 save(); S.view="exam"; S.tab="hx"; render(); startTick(); window.scrollTo(0,0);
}
function toExaminer(){
 const E=S.persist.exam; E.phase="exq"; E.phaseStart=Date.now(); save(); render(); startTick(); window.scrollTo(0,0);
}
function finishExam(){
 const E=S.persist.exam; const c=caseById(E.caseId);
 const sc = scoreOf(E,c);
 E.phase="done"; E.finished=Date.now();
 S.persist.records.unshift({caseId:c.id, label:c.label, date:new Date().toISOString(), hk:sc.hk, nk:sc.nk, hxN:E.asked.length, neN:E.done.length, mins:Math.round((E.finished-E.started)/60000), self:sc.self});
 S.persist.records = S.persist.records.slice(0,60);
 save(); clearInterval(tick); S.view="debrief"; render(); window.scrollTo(0,0);
}
function scoreOf(E,c){
 const hkKeys=Object.keys(c.hk), nkKeys=Object.keys(c.nk);
 const hkHit=hkKeys.filter(k=>E.asked.includes(k)).length, nkHit=nkKeys.filter(k=>E.done.includes(k)).length;
 const rates=Object.values(E.qrate||{}); const map={good:2,ok:1,bad:0};
 const self = rates.length? Math.round(rates.reduce((a,b)=>a+(map[b]??0),0)/(rates.length*2)*100) : null;
 return {hk:Math.round(hkHit/hkKeys.length*100), nk:Math.round(nkHit/nkKeys.length*100), hkHit, nkHit, hkN:hkKeys.length, nkN:nkKeys.length, self};
}
function hxAnswer(c,id){
 if(id==="female") return c.sex==="M" ? "（男性病人，不適用）" : (c.hx.female || "月經規律，沒有懷孕，沒吃避孕藥。");
 return c.hx[id] || HX_DEFAULT[id] || "沒有特別的。";
}
function neAnswer(c,id){ return c.ne[id] || NE_DEFAULT[id] || "正常。"; }
function askItem(kind,id){
 const E=S.persist.exam, c=caseById(E.caseId);
 if(kind==="hx"){ if(!E.asked.includes(id)) E.asked.push(id); E.log.push({t:"hx", id, q:HX_LABEL[id], a:hxAnswer(c,id)}); }
 else { if(!E.done.includes(id)) E.done.push(id); E.log.push({t:"ne", id, q:NE_LABEL[id], a:neAnswer(c,id)}); }
 save(); renderExamDynamic();
}

/* AI 標準化病人 / 檢查 */
async function aiAsk(kind){
 const inp=$("#askbox"); const text=inp.value.trim(); if(!text||S.aiBusy||!S.sample) return;
 const E=S.persist.exam, c=caseById(E.caseId);
 S.aiBusy=true; inp.value=""; E.log.push({t:"ai", q:text, a:"……", pending:true}); renderExamDynamic();
 const entry=E.log[E.log.length-1];
 let prompt;
 if(kind==="hx"){
  const script = HX_GROUPS.flatMap(g=>g[1]).map(([id,l])=>`${id}｜${l}：${hxAnswer(c,id)}`).join("\n");
  const recent = E.log.filter(x=>x.t!=="ne" && !x.pending).slice(-14).map(x=>`考生：${x.q}\n病人：${x.a}`).join("\n");
  prompt = `你在台灣神經專科醫師口試中扮演標準化病人。病人：${c.age} 歲${c.sex==="M"?"男性":"女性"}。進場情形：${c.door}\n開場主訴：${c.cc}\n\n病人劇本（每行為「項目代碼｜項目：病人會怎麼回答」）：\n${script}\n\n規則：\n1. 用第一人稱、台灣口語中文回答，1 到 3 句，只回答考生這一句問到的內容，不要主動補充其他症狀。\n2. 不說醫學術語，不說出診斷名稱，不給提示。\n3. 劇本沒寫到的，就依劇本與這個病合理地回答；和這個病無關的就說沒有或不清楚。劇本括號內寫「若追問」的內容，只有考生追問細節時才說。\n4. 若考生要做身體檢查，回覆「（請改用『神經學檢查』的按鈕或檢查欄）」。\n5. covered 列出這句問題實質問到的劇本項目代碼（只能用上面的代碼，可為空陣列）。\n\n先前對話：\n${recent||"（無）"}\n\n考生現在問：「${text}」\n\n只回覆一個 JSON：{"reply":"病人的回答","covered":["代碼"]}`;
 } else {
  const script = NE_GROUPS.flatMap(g=>g[1]).map(([id,l])=>`${id}｜${l}：${neAnswer(c,id)}`).join("\n");
  prompt = `你在台灣神經專科醫師口試中擔任考官，回報考生所做身體檢查的結果。病人：${c.age} 歲${c.sex==="M"?"男性":"女性"}。\n\n檢查結果劇本（每行為「項目代碼｜檢查：結果」）：\n${script}\n\n規則：\n1. 考生描述他要做的檢查，你用客觀的檢查發現回覆（中英夾雜病歷寫法，1 到 3 句），只回報他做的那項。\n2. 劇本沒有的檢查，依照這個病合理推論並保持一致；不要說出診斷，不要提示其他檢查。\n3. 考生描述的做法若明顯錯誤（例如 Romberg 沒有併腳），簡短指出。\n4. covered 列出相符的項目代碼（只能用上面的代碼，可為空陣列）。\n\n考生的檢查：「${text}」\n\n只回覆一個 JSON：{"reply":"檢查結果","covered":["代碼"]}`;
 }
 try{
  const res = await S.sample.json(prompt, {modelTier:"quick", cache:false});
  entry.a = String(res && res.reply || "（沒有回應）");
  const valid = kind==="hx"? HX_LABEL : NE_LABEL;
  for(const k of (Array.isArray(res&&res.covered)?res.covered:[])){ if(valid[k]){ const arr= kind==="hx"?E.asked:E.done; if(!arr.includes(k)) arr.push(k); } }
  entry.kind = kind;
 }catch(e){ entry.a = aiErr(e) || "（已取消）"; }
 delete entry.pending; S.aiBusy=false; save(); renderExamDynamic();
 const i=$("#askbox"); if(i) i.focus();
}

/* AI 考官 */
async function aiExaminer(userText){
 if(S.aiBusy||!S.sample) return;
 const E=S.persist.exam, c=caseById(E.caseId);
 if(userText) E.chat.push({role:"user", content:userText});
 const missedH = Object.keys(c.hk).filter(k=>!E.asked.includes(k)).map(k=>HX_LABEL[k]).join("、")||"無";
 const missedN = Object.keys(c.nk).filter(k=>!E.done.includes(k)).map(k=>NE_LABEL[k]).join("、")||"無";
 const rules = `你是台灣神經專科醫師口試的三位考官之一，現在是「考官提問（電人）」時間。用繁體中文、醫學名詞保留英文，語氣專業但有壓力。\n\n本題資料（考生看不到）：\n- 病例摘要：${c.ans.summary}\n- 參考定位：${c.ans.loc}\n- 參考鑑別：${c.ans.ddx.join("；")}\n- 參考檢查：${c.ans.work.join("；")}\n- 參考題目：${c.q.map(x=>x[0]).join(" / ")}\n- 考生漏問的重點病史：${missedH}\n- 考生漏做的重點檢查：${missedN}\n\n考生的報告：\nSummary：${E.pres.summary||"（未寫）"}\nLocalization：${E.pres.loc||"（未寫）"}\nDDx：${E.pres.ddx||"（未寫）"}\nWorkup：${E.pres.work||"（未寫）"}\n\n規則：一次只問一個問題。先針對考生報告的漏洞與漏問漏做的地方追問，再問參考題目中的觀念。考生回答後，用一到兩句點評（對的地方、缺的關鍵點），接著問下一題。不要直接給完整答案，除非考生說不會。全部問完約 6 題後，給出總評（優點、需加強、及格與否的印象）。`;
 const turns = [{role:"user", content:rules + (E.chat.length? "" : "\n\n請開始第一個問題。")}, ...E.chat];
 if(turns[turns.length-1].role!=="user") turns.push({role:"user",content:"請繼續。"});
 E.chat.push({role:"assistant", content:"考官思考中……", pending:true});
 S.aiBusy=true; renderExaminerChat();
 const msg=E.chat[E.chat.length-1];
 try{
  const ctl = new AbortController(); S.ctl=ctl;
  const {text} = await S.sample(turns, {cache:false, signal:ctl.signal, onText:({text})=>{ msg.content=text; renderExaminerChat(); }});
  msg.content=text;
 }catch(e){ msg.content = (e && e.text) || aiErr(e) || "（已停止）"; }
 delete msg.pending; S.aiBusy=false; save(); renderExaminerChat();
}

function cleanCase(o){
 if(!o||typeof o!=="object") throw new Error("格式錯誤");
 const str=v=>String(v??"").trim();
 const pick=(obj,label)=>{const r={}; if(obj&&typeof obj==="object") for(const [k,v] of Object.entries(obj)) if(label[k]&&str(v)) r[k]=str(v); return r;};
 const c={id:"ai"+Date.now().toString(36), src:"ai", age:Math.max(1,Math.min(99,parseInt(o.age)||50)), sex:o.sex==="F"?"F":"M",
  domain:str(o.domain)||"AI", label:str(o.label)||"AI 案例", door:str(o.door), cc:str(o.cc),
  hx:pick(o.hx,HX_LABEL), ne:pick(o.ne,NE_LABEL), hk:pick(o.hk,HX_LABEL), nk:pick(o.nk,NE_LABEL),
  ans:{summary:str(o.ans&&o.ans.summary), loc:str(o.ans&&o.ans.loc), ddx:(o.ans&&Array.isArray(o.ans.ddx)?o.ans.ddx:[]).map(str).filter(Boolean),
   work:(o.ans&&Array.isArray(o.ans.work)?o.ans.work:[]).map(str).filter(Boolean), dx:str(o.ans&&o.ans.dx)+"（AI 生成）", pearls:(o.ans&&Array.isArray(o.ans.pearls)?o.ans.pearls:[]).map(str).filter(Boolean)},
  q:(Array.isArray(o.q)?o.q:[]).map(x=>Array.isArray(x)?[str(x[0]),str(x[1])]:[str(x&&x.q),str(x&&x.a)]).filter(x=>x[0]&&x[1]),
  note:"AI 生成案例：由 Gemini 依本站模板即時生成，內容未經人工審閱，請自行查核。"};
 if(Object.keys(c.hx).length<8||Object.keys(c.ne).length<6||Object.keys(c.hk).length<3||Object.keys(c.nk).length<3||!c.q.length||!c.ans.summary) throw new Error("內容不完整");
 return c;
}

function bankItems(){
 const fromCases = allCases().flatMap(c=>c.q.map(q=>({dom:c.domain, src:c.label, q:q[0], a:q[1], real:c.src==="real"})));
 const gen = GENERAL_Q.map(g=>({dom:g[0], src:"模板整理", q:g[1], a:g[2], real:false}));
 return [...fromCases, ...gen];
}
function domainOf(d){ const m=d.toLowerCase(); if(m.includes("demyelinating")) return "Demyelinating"; if(m.includes("myelo")||m.includes("hsp")) return "Myelopathy"; if(m.includes("plexopathy")) return "Neuropathy / MND"; if(m.includes("neuropathy")||m.includes("motor neuron")) return "Neuropathy / MND"; if(m.includes("myopathy")||m.includes("nmj")) return "Muscle / NMJ"; if(m.includes("ataxia")) return "Ataxia"; if(m.includes("parkinson")||m.includes("movement")) return "Movement"; if(m.includes("cranial")) return "Cranial nerves"; if(m.includes("cognition")||m.includes("leuko")) return "Cognition"; return "General"; }
function viewBank(){
 let items = bankItems().map(x=>({...x, d:domainOf(x.dom)}));
 const doms = [...new Set(items.map(x=>x.d))];
 if(S.bankFilter!=="all") items=items.filter(x=>x.d===S.bankFilter);
 if(S.bankOnlyWeak) items=items.filter(x=>S.persist.ratings[x.q]!=="good");
 const n=items.length; if(S.bankIdx>=n) S.bankIdx=0;
 const it=items[S.bankIdx];
 const r=S.persist.ratings; const all=bankItems(); const good=all.filter(x=>r[x.q]==="good").length;
 return `<div class="stack"><div><h2>考官題庫</h2><p class="muted" style="margin:4px 0 0">共 ${all.length} 題：真實考官提問、各案例考點與模板整理。已掌握 ${good} 題。</p></div>
 <div class="bankbar"><select id="bankf"><option value="all">全部領域</option>${doms.map(d=>`<option ${S.bankFilter===d?"selected":""}>${esc(d)}</option>`).join("")}</select>
 <label class="toggle"><input type="checkbox" id="weak" ${S.bankOnlyWeak?"checked":""}> 只看還沒掌握的</label><span class="small muted mono">${n? (S.bankIdx+1)+" / "+n : "0"}</span>
 <button class="btn sm" data-act="bshuffle">隨機一題</button></div>
 ${it? `<div class="qcard flash"><div class="row"><span class="pill">${esc(it.d)}</span>${it.real?'<span class="badge real">真實考官提問</span>':""}<span class="small muted">${esc(it.src)}</span></div>
  <div class="qt">${esc(it.q)}</div>
  ${S.bankShow? `<div class="ansbox">${esc(it.a)}</div><div class="rate">${[["good","答得出來"],["ok","部分"],["bad","不會"]].map(([k,l])=>`<button data-brate="${k}" aria-pressed="${r[it.q]===k}">${l}</button>`).join("")}</div>` : `<div><button class="btn" data-act="bshow">翻開答案</button></div>`}
  <div class="row"><button class="btn sm" data-act="bprev" ${S.bankIdx===0?"disabled":""}>上一題</button><button class="btn sm" data-act="bnext" ${S.bankIdx>=n-1?"disabled":""}>下一題</button></div></div>` : `<div class="empty">這個篩選下沒有題目了。</div>`}
 </div>`;
}

function viewRecords(){
 const R=S.persist.records;
 return `<div class="stack"><div class="row"><h2 style="margin-right:auto">練習紀錄</h2>${R.length?'<button class="btn sm" data-act="clearrec">清除紀錄</button>':""}</div>
 ${R.length? `<div class="panel tablewrap"><table class="rec"><thead><tr><th>日期</th><th>案例</th><th>重點病史</th><th>重點檢查</th><th>病史/檢查數</th><th>考官題自評</th><th>用時</th></tr></thead><tbody>${R.map(x=>`<tr><td class="mono">${esc(new Date(x.date).toLocaleDateString("zh-TW",{month:"2-digit",day:"2-digit"}))}</td><td>${esc(x.label)}</td><td class="mono">${x.hk}%</td><td class="mono">${x.nk}%</td><td class="mono">${x.hxN} / ${x.neN}</td><td class="mono">${x.self==null?"—":x.self+"%"}</td><td class="mono">${x.mins}′</td></tr>`).join("")}</tbody></table></div><p class="small muted">紀錄只存在這個瀏覽器。</p>` : `<div class="empty">完成第一場模擬考後，成績會出現在這裡。</div>`}
 <div id="clearconfirm"></div></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
 const t=e.target.closest("button"); if(!t) return;
 const d=t.dataset;
 if(d.nav){ S.view=d.nav; if(d.nav==="home" && S.persist.exam && S.persist.exam.phase!=="done"){ S.view="home"; } render(); window.scrollTo(0,0); return; }
 if(d.tab){ S.tab=d.tab; render(); return; }
 if(d.item){ askItem(S.tab, d.item); return; }
 if(d.tpl){ S.tpl=d.tpl; render(); return; }
 if(d.exmode){ S.persist.exam.examMode=d.exmode; save(); render(); return; }
 if(d.rate){ const E=S.persist.exam; E.qrate[Math.min(E.qi,caseById(E.caseId).q.length-1)]=d.rate; save(); render(); return; }
 if(d.brate){ const items=currentBank(); const it=items[S.bankIdx]; if(it){ S.persist.ratings[it.q]=d.brate; save(); render(); } return; }
 const a=d.act; if(!a) return;
 const E=S.persist.exam;
 switch(a){
  case "start": readSettings(); startExam(); break;
  case "startcase": S.persist.settings.mode="pick"; S.persist.settings.pick=d.id; readSettings(true); startExam(); break;
  case "resume": S.view="exam"; render(); startTick(); break;
  case "abandon": S.persist.exam=null; save(); clearInterval(tick); render(); break;
  case "toexq": toExaminer(); break;
  case "finish": finishExam(); break;
  case "home": S.persist.exam=null; save(); S.view="home"; render(); break;
  case "again": { const id=E.caseId; S.persist.settings.mode="pick"; S.persist.settings.pick=id; save(); startExam(); break; }
  case "aiask": aiAsk(S.tab); break;
  case "qshow": E.qshow=true; save(); render(); break;
  case "qprev": E.qi=Math.max(0,E.qi-1); E.qshow=false; save(); render(); break;
  case "qnext": E.qi=Math.min(caseById(E.caseId).q.length-1,E.qi+1); E.qshow=false; save(); render(); break;
  case "exstart": aiExaminer(""); break;
  case "exsend": { const v=$("#exbox").value.trim(); if(v){ $("#exbox").value=""; aiExaminer(v);} break; }
  case "exstop": if(S.ctl) S.ctl.abort(); break;
  case "aigrade": aiGrade(); break;
  case "gen": genCase(); break;
  case "gsave": G.key=$("#gkey").value.trim(); G.model=$("#gmodel").value.trim()||"gemini-2.5-flash"; gSave(G); refreshAI(); $("#gmsg").textContent=G.key?"已儲存。":"已儲存（未設定金鑰）。"; break;
  case "gtest": G.key=$("#gkey").value.trim(); G.model=$("#gmodel").value.trim()||"gemini-2.5-flash"; gSave(G); refreshAI(); gTest(); break;
  case "gclear": G.key=""; gSave(G); refreshAI(); render(); break;
  case "delai": S.persist.custom=(S.persist.custom||[]).filter(c=>c.id!==d.id); if(S.persist.settings.pick===d.id) S.persist.settings.pick="c1"; save(); render(); break;
  case "libtoggle": S.libOpen[d.id]=!S.libOpen[d.id]; render(); break;
  case "bshow": S.bankShow=true; render(); break;
  case "bnext": S.bankIdx++; S.bankShow=false; render(); break;
  case "bprev": S.bankIdx=Math.max(0,S.bankIdx-1); S.bankShow=false; render(); break;
  case "bshuffle": { const n=currentBank().length; S.bankIdx=Math.floor(Math.random()*Math.max(1,n)); S.bankShow=false; render(); break; }
  case "clearrec": $("#clearconfirm").innerHTML=`<div class="panel row"><span style="margin-right:auto">確定清除全部練習紀錄與題庫自評？</span><button class="btn" data-act="clearno">取消</button><button class="btn primary" data-act="clearyes">清除</button></div>`; break;
  case "clearno": $("#clearconfirm").innerHTML=""; break;
  case "clearyes": S.persist.records=[]; S.persist.ratings={}; save(); render(); break;
 }
});
function currentBank(){ let items=bankItems().map(x=>({...x,d:domainOf(x.dom)})); if(S.bankFilter!=="all") items=items.filter(x=>x.d===S.bankFilter); if(S.bankOnlyWeak) items=items.filter(x=>S.persist.ratings[x.q]!=="good"); return items; }
function readSettings(keepMode){
 const st=S.persist.settings;
 const enc=$("#enc"), exq=$("#exq"), snd=$("#sound");
 if(enc) st.enc=Math.max(5,Math.min(90,+enc.value||40));
 if(exq) st.exq=Math.max(5,Math.min(60,+exq.value||20));
 if(snd) st.sound=snd.checked;
 if(!keepMode){ const m=document.querySelector('input[name=mode]:checked'); if(m) st.mode=m.value; const p=$("#pick"); if(p) st.pick=p.value; }
 save();
}
document.addEventListener("change", e=>{
 const t=e.target;
 if(t.name==="mode"){ S.persist.settings.mode=t.value; $("#pick").disabled = t.value!=="pick"; save(); }
 if(t.id==="pick"){ S.persist.settings.pick=t.value; save(); }
 if(t.id==="enc"||t.id==="exq"||t.id==="sound"){ readSettings(true); const f=document.querySelector(".flow"); if(f) render(); }
 if(t.id==="bankf"){ S.bankFilter=t.value; S.bankIdx=0; S.bankShow=false; render(); }
 if(t.id==="weak"){ S.bankOnlyWeak=t.checked; S.bankIdx=0; S.bankShow=false; render(); }
});
document.addEventListener("input", e=>{
 const t=e.target, E=S.persist.exam; if(!E) return;
 if(t.id==="notes"){ E.notes=t.value; save(); }
 if(t.id && t.id.startsWith("p_")){ E.pres[t.id.slice(2)]=t.value; save(); }
 if(t.id==="qans"){ E.qans[Math.min(E.qi,caseById(E.caseId).q.length-1)]=t.value; save(); }
});
document.addEventListener("keydown", e=>{
 if(e.key!=="Enter"||e.isComposing) return;
 if(e.target.id==="askbox"){ e.preventDefault(); aiAsk(S.tab); }
 if(e.target.id==="exbox"){ e.preventDefault(); const v=e.target.value.trim(); if(v){ e.target.value=""; aiExaminer(v);} }
});

/* boot */
if(S.persist.exam && S.persist.exam.phase!=="done"){ S.view="exam"; startTick(); }
else if(S.persist.exam && S.persist.exam.phase==="done"){ S.persist.exam=null; save(); }
render();
</script>
</body>
</html>
